name: build-deploy

on:
  push:
    branches:
      - main 

jobs:
 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Create app.txt file
        run: echo "Hello from the build job!" > app.txt

      - name: Upload app.txt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-artifact
          path: app.txt

 
  deploy:
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download app.txt artifact
        uses: actions/download-artifact@v4
        with:
          name: my-app-artifact

      - name: Read the content of app.txt
        run: cat app.txt